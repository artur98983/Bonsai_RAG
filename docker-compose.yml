services:

  bonsai:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: bonsai
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - /mnt/hdd700/LLM/models:/models:ro

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    command:
      - "-m"
      - "/models/bonsai/Ternary-Bonsai-2-27B-PTQ1_0.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-ngl"
      - "all"
      - "-c"
      - "16384"
      - "-np"
      - "1"


  qdrant:
    image: qdrant/qdrant:latest

    container_name: bonsai-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./data/qdrant:/qdrant/storage


  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile

    container_name: bonsai-rag
    restart: unless-stopped

    depends_on:
      - qdrant
      - bonsai

    ports:
      - "8000:8000"

    environment:
      QDRANT_URL: http://qdrant:6333
      BONSAI_URL: http://bonsai:8080

      DATABASE_PATH: /data/rag.db

      PROJECTS_PATH: /projects

      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5

    volumes:
      - ./data/sqlite:/data
      - ./projects:/projects

    cpus: 8
    mem_limit: 8g
